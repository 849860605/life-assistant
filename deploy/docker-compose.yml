# 本地开发：只起数据库和 Redis，应用用 mvn spring-boot:run 跑
#   docker compose -f deploy/docker-compose.yml up -d postgres redis
# 服务器一键部署（前后端 + 数据库 + Redis）：
#   deploy/deploy.sh
# IMAGE_MIRROR 是镜像站前缀（如 docker.m.daocloud.io/），国内拉不到 Docker Hub 时 deploy.sh 会自动设置。
name: ${COMPOSE_PROJECT_NAME:-life-assistant}

services:
  postgres:
    image: ${IMAGE_MIRROR:-}pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-life}
      POSTGRES_USER: ${DB_USER:-life}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-life}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-life} -d ${DB_NAME:-life}"]
      interval: 5s
      retries: 10

  redis:
    image: ${IMAGE_MIRROR:-}library/redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # 设了 REDIS_PASSWORD 就开密码
    command: ["sh", "-c", "exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MIRROR: ${IMAGE_MIRROR:-}
    image: life-assistant-app
    restart: unless-stopped
    profiles: ["app"]
    env_file: ../.env
    # 下面这些覆盖 .env 里本地开发用的值
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      LIFE_EVAL_DIR: /app/eval/cases
      LIFE_STORAGE_DIR: /app/data/files
      FLYAI_COMMAND: /app/tools/node_modules/.bin/flyai
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        MIRROR: ${IMAGE_MIRROR:-}
    image: life-assistant-web
    restart: unless-stopped
    profiles: ["app"]
    environment:
      # 填域名（空格分隔，如 "example.com www.example.com"）就自动申请证书、开 HTTPS；不填只开 80
      SITE_DOMAINS: ${SITE_DOMAINS:-}
    ports:
      - "${WEB_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    depends_on:
      app:
        condition: service_healthy

  # 证书：申请 Let's Encrypt 证书，每 12 小时检查续期；没配 SITE_DOMAINS 时什么也不做
  certbot:
    image: ${IMAGE_MIRROR:-}certbot/certbot:v2.11.0
    restart: unless-stopped
    profiles: ["app"]
    entrypoint: ["/bin/sh", "/certbot.sh"]
    environment:
      SITE_DOMAINS: ${SITE_DOMAINS:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - ./certbot.sh:/certbot.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - web

volumes:
  pg-data:
  redis-data:
  app-data:
  letsencrypt:
  certbot-www:
