# 本地开发：只起数据库和 Redis，应用用 mvn spring-boot:run 跑
#   docker compose -f deploy/docker-compose.yml up -d postgres redis
# 服务器部署：连应用一起起
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
name: life-assistant

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-life}
      POSTGRES_USER: ${DB_USER:-life}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-life}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-life} -d ${DB_NAME:-life}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    profiles: ["app"]
    env_file: ../.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      LIFE_EVAL_DIR: /app/eval/cases
      LIFE_STORAGE_DIR: /app/data/files
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg-data:
  redis-data:
  app-data:
