# 安全响应头：不许别的网站把页面嵌进去（防点击劫持），不许浏览器猜文件类型，跨站时只带域名不带完整地址。
# nginx 的 add_header 在 location 里写了自己的 add_header 后不再继承上一层，所以这些 location 都要再 include 一次。
# 还没有 HTTPS 证书，先不加 HSTS；证书下来后在 https 的 server 里加。
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
